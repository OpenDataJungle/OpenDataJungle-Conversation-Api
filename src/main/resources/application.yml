application:
  title: ${APPLICATION_TITLE:VectoPath Conversation API}
  version: ${APPLICATION_VERSION:@project.version@}

spring:
  application:
    name: VectoPath Conversation API

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/realms/master}


  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vecto_path}
    username: ${DATABASE_USERNAME:user}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    open-in-view: ${JPA_OPEN_IN_VIEW:false}

security:
  scopes:
    conversations:
      read: ${SECURITY_SCOPE_CONVERSATIONS_READ:conversations.read}
      write: ${SECURITY_SCOPE_CONVERSATIONS_WRITE:conversations.write}
      delete: ${SECURITY_SCOPE_CONVERSATIONS_DELETE:conversations.delete}
      admin: ${SECURITY_SCOPE_CONVERSATIONS_ADMIN:conversations.admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:3000,http://localhost:4200,http://localhost:8080,http://localhost:9000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Access-Control-Allow-Origin,Access-Control-Allow-Credentials}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: ${CORS_MAX_AGE:3600}

vecto-path:
  api:
    base-url: ${VECTO_PATH_API_BASE_URL:http://localhost:8081}
    search-semantic-path: ${VECTO_PATH_API_SEARCH_SEMANTIC_PATH:/api/v1/search/semantic}
    resource-content-path: ${VECTO_PATH_API_RESOURCE_CONTENT_PATH:/api/v1/resources}
  chat:
    max-context-tokens: ${VECTO_PATH_CHAT_MAX_CONTEXT_TOKENS:100000}
    default-system-prompt: >-
      Tu es un assistant intelligent et utile.
      Tu disposes d'un outil 'searchResources' permettant d'interroger la base de connaissances de l'entreprise.
      Utilise cet outil uniquement dans les cas suivants :
      1. L'utilisateur demande explicitement de consulter la base de connaissances / GED ou documents interne.
      2. La question porte sur un sujet métier, technique ou documentaire pour lequel des ressources internes pourraient apporter une réponse pertinente.
      N'utilise PAS cet outil pour des demandes générales (reformulation, explication de concepts généraux, questions de politesse, etc.).
      Lorsque tu utilises l'outil, base ta réponse sur le contenu récupéré.
      Si aucun contenu pertinent n'est trouvé, indique-le honnêtement.
      Tu réponds toujours au format Markdown à 100%.
    resource-ids-required-prompt: >-
      Tu es un assistant intelligent et utile.
      Tu disposes d'un outil 'searchResources' permettant d'interroger la base de connaissances.
      Des resource IDs ont été fournis : tu DOIS obligatoirement appeler l'outil 'searchResources' pour récupérer le contenu des ressources correspondantes avant de répondre à l'utilisateur.
      Utilise cet outil également dans les cas suivants :
      1. L'utilisateur demande explicitement de consulter la base de connaissances / GED ou documents interne.
      2. La question porte sur un sujet métier, technique ou documentaire pour lequel des ressources internes pourraient apporter une réponse pertinente.
      N'utilise PAS cet outil pour des demandes générales (reformulation, explication de concepts généraux, questions de politesse, etc.).
      Lorsque tu utilises l'outil, base ta réponse sur le contenu récupéré.
      Si aucun contenu pertinent n'est trouvé, indique-le honnêtement.
      Tu réponds toujours au format Markdown à 100%.
    categorizer-system-prompt: >-
      Tu es un assistant de routage de ressources. L'utilisateur a fourni des ressources (fichiers ou documents).
      Ton seul rôle est de décider comment ces ressources doivent être utilisées en fonction du message de l'utilisateur.
      Réponds UNIQUEMENT avec un objet JSON valide, sans aucun formatage markdown ni texte supplémentaire.
      Règles de décision :
      - Réponds {"strategy":"SEARCH"} si l'utilisateur souhaite interroger, rechercher des informations précises, poser des questions sur le contenu des ressources, ou si le contenu n'a pas besoin d'être lu en intégralité.
      - Réponds {"strategy":"INCLUDE_IN_PROMPT"} si l'utilisateur souhaite résumer, analyser, traduire, reformuler, comparer ou traiter l'intégralité du contenu des ressources.
      En cas de doute, réponds {"strategy":"SEARCH"}.
  # Set to false to disable the default ResourceRoutingPreProcessor entirely.
  # You can then plug in your own ChatPreProcessor bean(s) with the desired behaviour.
  resource-routing:
    enabled: ${VECTO_PATH_CHAT_RESOURCE_ROUTING_ENABLED:true}
  validation:
    message-max-size: ${VALIDATION_MESSAGE_MAX_SIZE:50000}
    system-message-max-size: ${VALIDATION_SYSTEM_MESSAGE_MAX_SIZE:8000}
    title-max-size: ${VALIDATION_TITLE_MAX_SIZE:500}
  llm:
    models-json: >-
      ${VECTO_PATH_LLM_MODELS:{"default":{"provider":"openai","apiKey":"demo","baseUrl":"","model":"gpt-4o","name":"Default LLM"}}}
  mcp:
    server-json: >-
      ${VECTO_PATH_MCP_SERVERS:{}}

server:
  port: ${SERVER_PORT:8080}

spring.jackson:
  time-zone: ${JACKSON_TIME_ZONE:UTC}

logging:
  level:
    com.laulem.vectopath: ${LOGGING_LEVEL_VECTOPATH:INFO}
    org.springframework.ai: ${LOGGING_LEVEL_SPRING_AI:INFO}
  pattern:
    console: "${LOGGING_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss} - %msg%n}"

management:
  info:
    ssl:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    db:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false



