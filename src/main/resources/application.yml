application:
  title: ${APPLICATION_TITLE:OpenDataJungle Conversation API}
  version: ${APPLICATION_VERSION:@project.version@}

spring:
  application:
    name: OpenDataJungle Conversation API

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/realms/master}


  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/open_data_jungle}
    username: ${DATABASE_USERNAME:user}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    open-in-view: ${JPA_OPEN_IN_VIEW:false}

security:
  scopes:
    conversations:
      read: ${SECURITY_SCOPE_CONVERSATIONS_READ:conversations.read}
      write: ${SECURITY_SCOPE_CONVERSATIONS_WRITE:conversations.write}
      delete: ${SECURITY_SCOPE_CONVERSATIONS_DELETE:conversations.delete}
      admin: ${SECURITY_SCOPE_CONVERSATIONS_ADMIN:conversations.admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:3000,http://localhost:4200,http://localhost:8080,http://localhost:9000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Access-Control-Allow-Origin,Access-Control-Allow-Credentials}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: ${CORS_MAX_AGE:3600}

open-data-jungle:
  knowledge-api:
    base-url: ${OPEN_DATA_JUNGLE_KNOWLEDGE_API_BASE_URL:http://localhost:8081}
    search-semantic-path: ${OPEN_DATA_JUNGLE_KNOWLEDGE_API_SEARCH_SEMANTIC_PATH:/api/v1/search/semantic}
    resource-content-path: ${OPEN_DATA_JUNGLE_KNOWLEDGE_API_RESOURCE_CONTENT_PATH:/api/v1/resources}
  chat:
    max-context-tokens: ${OPEN_DATA_JUNGLE_CHAT_MAX_CONTEXT_TOKENS:100000}
    pre-processors:
      default-system-prompt:
        enabled: ${OPEN_DATA_JUNGLE_CHAT_PRE_PROCESSORS_DEFAULT_SYSTEM_PROMPT_ENABLED:true}
        prompt: >-
          Tu es un assistant intelligent et utile.
          Tu disposes d'un outil 'searchResources' permettant d'interroger la base de connaissances de l'entreprise.
          Utilise cet outil uniquement dans les cas suivants :
          1. L'utilisateur demande explicitement de consulter la base de connaissances / GED ou documents interne.
          2. La question porte sur un sujet métier, technique ou documentaire pour lequel des ressources internes pourraient apporter une réponse pertinente.
          N'utilise PAS cet outil pour des demandes générales (reformulation, explication de concepts généraux, questions de politesse, etc.).
          Lorsque tu utilises l'outil, base ta réponse sur le contenu récupéré.
          Si aucun contenu pertinent n'est trouvé, indique-le honnêtement.
          Tu réponds toujours au format Markdown à 100%.
      resource-categorization:
        enabled: ${OPEN_DATA_JUNGLE_CHAT_PRE_PROCESSORS_RESOURCE_CATEGORIZATION_ENABLED:true}
        categorizer-system-prompt: >-
          Tu es un assistant de routage de ressources.
            L'utilisateur peut fournir une ou plusieurs ressources (fichiers, documents, PDF, pièces jointes, etc.).
            Ton unique mission est de déterminer la meilleure stratégie d'utilisation de ces ressources en fonction du message de l'utilisateur.
            Tu dois répondre UNIQUEMENT avec un objet JSON valide.
            Ne retourne aucun texte supplémentaire.
            Ne retourne aucun markdown.
            Ne retourne aucune explication.
          Les réponses possibles sont exclusivement :
            {"strategy":"INTERNAL_SEARCH"}
            {"strategy":"INCLUDE_IN_PROMPT"}
          Définitions :
            - INTERNAL_SEARCH :
              Utiliser cette stratégie lorsque l'utilisateur recherche une information précise ou pose une question ciblée dont la réponse peut être trouvée dans une partie limitée du contenu, sans nécessiter une lecture ou une compréhension globale des ressources.
            - INCLUDE_IN_PROMPT :
              Utiliser cette stratégie lorsque la demande nécessite une compréhension globale, une lecture complète ou une analyse substantielle des ressources.
          Règles :
          Réponds {"strategy":"INTERNAL_SEARCH"} lorsque l'utilisateur :
            - recherche une information spécifique ;
            - pose une question précise sur le contenu ;
            - demande de retrouver un élément particulier ;
            - demande une valeur, une date, un nom, un numéro ou un passage précis ;
            - souhaite effectuer une recherche ciblée dans les ressources.
          Exemples :
            - Quel est le numéro du contrat ?
            - Qui a signé le document ?
            - Quelle est la date de livraison ?
            - Recherche les mentions de Spring Boot.
            - Trouve les erreurs présentes dans les logs.
            - Quel est le montant indiqué sur la facture ?
            - Dans quel chapitre parle-t-on de sécurité ?
          Réponds {"strategy":"INCLUDE_IN_PROMPT"} lorsque l'utilisateur :
            - demande un résumé ;
            - demande une synthèse ;
            - demande ce que contient le document ;
            - demande une explication générale ;
            - demande une analyse ;
            - demande une traduction ;
            - demande une reformulation ;
            - demande une comparaison ;
            - demande un avis ou une revue du document ;
            - demande d'extraire les points importants ;
            - demande un traitement portant sur l'ensemble ou sur une partie importante des ressources ;
            - demande une compréhension globale du contenu.
          Exemples :
            - Résume ce document.
            - Fais une synthèse du PDF.
            - Explique-moi ce fichier.
            - Que contient ce document ?
            - Il y a quoi dans le fichier en pièce jointe ?
            - Analyse ce rapport.
            - Traduis ce document en anglais.
            - Reformule ce texte.
            - Compare ces deux documents.
            - Fais ressortir les points clés.
            - Donne-moi un avis sur ce document.
          Principe de décision :
          Si la demande peut être satisfaite par la récupération de quelques passages pertinents uniquement, réponds :
            {"strategy":"INTERNAL_SEARCH"}
          Si la demande nécessite une compréhension globale du contenu, réponds :
            {"strategy":"INCLUDE_IN_PROMPT"}
          En cas de doute, réponds toujours :
            {"strategy":"INTERNAL_SEARCH"}
      basic-resource-manager:
        enabled: ${OPEN_DATA_JUNGLE_CHAT_PRE_PROCESSORS_ADD_RESOURCE_TO_PROMPT_ENABLED:true}
        max-file-contents-tokens: ${OPEN_DATA_JUNGLE_CHAT_MAX_FILE_CONTENTS_SIZE:5000}
        resource-ids-required-prompt: >-
          Tu es un assistant intelligent et utile.
          Des resource (fichiers attachés au prompt) sont liées au prompt que tu dois récupérer obligatoirement.
          Pour y avoir accès, tu dois appeler l'outil 'searchResources' (recherche sémantique : RAG) pour récupérer le contenu (chunks) des ressources correspondantes.
          L'outil peut ne retourner aucun résultat, alors il faut demander à l'utilisateur des précisions sur la recherche.
          Base ta réponse sur le contenu récupéré. Si aucun contenu pertinent n'est trouvé, indique-le honnêtement.
          Tu réponds toujours au format Markdown à 100%.
        resources-into-prompt: >-
          Here are the files provided by the user. You must use them when responding to their request.
          If the request is not very specific, assume it relates to these files.
          Tu réponds toujours au format Markdown à 100%.
        too-long-prompt: >-
          MAX PRIORITY - IGNORE THE REST OF THE PROMPT : The user has provided files (resources), however the content of the message is too long.
          Ask the user to reduce the amount of data to be used. Do not respond with anything else.
          Ignore the content of the user message.
          Tu réponds toujours au format Markdown à 100%.
  validation:
    message-max-size: ${VALIDATION_MESSAGE_MAX_SIZE:50000}
    system-message-max-size: ${VALIDATION_SYSTEM_MESSAGE_MAX_SIZE:8000}
    title-max-size: ${VALIDATION_TITLE_MAX_SIZE:500}
  llm:
    models-json: >-
      ${OPEN_DATA_JUNGLE_LLM_MODELS:{"default":{"provider":"openai","apiKey":"demo","baseUrl":"","model":"gpt-4o","name":"Default LLM"}}}
    default-providers:
      openai:
        enabled: ${OPEN_DATA_JUNGLE_LLM_DEFAULT_PROVIDER_OPENAI_ENABLED:true}
      ollama:
        enabled: ${OPEN_DATA_JUNGLE_LLM_DEFAULT_PROVIDER_OLLAMA_ENABLED:true}
  mcp:
    server-json: >-
      ${OPEN_DATA_JUNGLE_MCP_SERVERS:{}}

server:
  port: ${SERVER_PORT:8080}

spring.jackson:
  time-zone: ${JACKSON_TIME_ZONE:UTC}

logging:
  level:
    com.laulem.opendatajungle: ${LOGGING_LEVEL_OPENDATAJUNGLE:INFO}
    org.springframework.ai: ${LOGGING_LEVEL_SPRING_AI:INFO}
  pattern:
    console: "${LOGGING_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss} - %msg%n}"

management:
  info:
    ssl:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    db:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false



